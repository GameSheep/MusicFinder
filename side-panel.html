<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MusicFinder 歌词</title>
<link rel="stylesheet" href="css/side-panel.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path class="f" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect class="f" x="6" y="5" width="4" height="14" rx="1.2"/><rect class="f" x="14" y="5" width="4" height="14" rx="1.2"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path class="f" d="M18 6.5v11a1 1 0 0 1-1.55.83L8.5 13v4.5a1 1 0 0 1-2 0v-11a1 1 0 0 1 2 0V11l7.95-5.33A1 1 0 0 1 18 6.5z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path class="f" d="M6 6.5v11a1 1 0 0 0 1.55.83L15.5 13v4.5a1 1 0 0 0 2 0v-11a1 1 0 0 0-2 0V11L7.55 5.67A1 1 0 0 0 6 6.5z"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
</svg>

<div class="bg" id="bg"></div>
<main class="wrap">
  <header class="head">
    <div class="cover" id="cover"><svg class="i"><use href="#i-music"/></svg></div>
    <div class="meta">
      <div class="title" id="title">未在播放</div>
      <div class="sub" id="sub">在弹窗中选择歌曲开始播放</div>
    </div>
  </header>

  <div class="lyrics" id="lyrics"></div>

  <footer class="ctrl">
    <div class="progress">
      <span class="time" id="cur">0:00</span>
      <input type="range" class="range" id="seek" min="0" max="1000" value="0" aria-label="进度">
      <span class="time" id="dur">0:00</span>
    </div>
    <div class="buttons">
      <button type="button" class="ibtn" id="prev" title="上一首"><svg class="i"><use href="#i-prev"/></svg></button>
      <button type="button" class="ibtn play" id="play" title="播放 / 暂停"><svg class="i"><use href="#i-play"/></svg></button>
      <button type="button" class="ibtn" id="next" title="下一首"><svg class="i"><use href="#i-next"/></svg></button>
    </div>
  </footer>
</main>

<script type="module" src="js/side-panel.js"></script>
</body>
</html>
